aid: gutendex
name: Gutendex
description: >-
  Gutendex is a simple, self-hosted JSON-based web API for serving book catalog information from Project Gutenberg,
  providing structured metadata for over 70,000 free ebooks including titles, authors, subjects, bookshelves, languages,
  copyright status, media types, downloadable formats, and download counts. The hosted instance at gutendex.com runs the
  open-source Django project by Gareth B. Johnson under the MIT license.
